dataset_name: cod_spd_20_aug
dim_coords: 3
root_path: ${oc.env:PROJECT_ROOT}/data/disorder/cod_20/mp_aug_spd
prop: ehull
num_targets: 1
# prop: scaled_lattice
# num_targets: 6
niggli: true
primitive: true
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 30
readout: mean
max_atoms: 20
otf_graph: false
eval_model_name: ${data.dataset_name}
tolerance: 0.1

use_space_group: false
use_pos_index: false
train_max_epochs: 2000
early_stopping_patience: 100000
teacher_forcing_max_epoch: 500

train_model:
  csp:
    lr: 0.0006
    num_gpus: 2
    batch_size: 128
    emb_pd_info: true
    pd_frac_coords_manifold: ${model.manifold_getter.coord_manifold}
  dng:
    lr: 0.0006
    num_gpus: 2
    batch_size: 128
    emb_pd_info: true
    pd_frac_coords_manifold: ${model.manifold_getter.coord_manifold}


datamodule:
  _target_: dmflow.data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: dmflow.data.dataset.DisorderedCrystDataset
      name: disorder train
      path: ${data.root_path}/train.csv
      save_path: ${data.root_path}/train_ori.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}

    val:
      - _target_: dmflow.data.dataset.DisorderedCrystDataset
        name: disorder val
        path: ${data.root_path}/val.csv
        save_path: ${data.root_path}/val_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

    test:
      - _target_: dmflow.data.dataset.DisorderedCrystDataset
        name: disorder test
        path: ${data.root_path}/test.csv
        save_path: ${data.root_path}/test_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

  num_workers:
    train: 40
    val: 40
    test: 40

  batch_size:
    train: 128
    val: 128
    test: 128
