[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmflow"]

[tool.hatch.build.targets.wheel.force-include]
"conf" = "conf"

[project]
name = "dmflow"
version = "0.1.0"
authors = [
  { name = "DMFlow Authors", email = "wlm155@126.com" },
]
description = "Official code for DMFlow: Disordered Materials Generation by Flow Matching."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md"}
requires-python = ">=3.9"
keywords = [
    "crystal generation",
    "disordered materials",
    "flow matching",
    "materials science",
    "structure prediction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Paper = "https://arxiv.org/abs/2602.04734"
OpenReview = "https://openreview.net/forum?id=kOVqhfeUgI"
FlowMM = "https://github.com/facebookresearch/flowmm"

[tool.black]
line-length = 88
target-version = ["py39"]
extend-exclude = "/remote/"

[tool.isort]
profile = "black"
multi_line_output = 3
skip_gitignore = true
line_length = 88
known_first_party = ["cdvae", "diffcsp", "dmflow", "manifm"]
